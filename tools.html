<!DOCTYPE html>
<html>

<head>

    <title>Useful Tools</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="container py-5">

    <div class="card shadow-lg p-4 rounded-5">

        <h1 class="text-center mb-4">
            Useful Tools
        </h1>

        <div class="text-center mb-4">

            <a href="index.html"
            class="btn btn-success rounded-pill px-4">

              Back To Home
              
        </a>
        
    </div>


<!--*************** Calculator ***************-->

        <hr>

        <h2>Simple Calculator</h2>

        <input type="number"
        class="form-control"
        id="num1" placeholder="First Number">

        <br><br>

        <input type="number" 
        class="form-control"
        id="num2" placeholder="Second Number">

        <br><br>

        <button onclick="add()">Add</button>
        <button onclick="subtract()">Subtract</button>
        <button onclick="multiply()">Multiply</button>
        <button onclick="divide()">Divide</button>

        <p id="calcResult"></p>


 <!--*************** BMI Checker ***************-->

    <hr>

    <h2>BMI Checker</h2>

    <input type="number" 
    class="form-control"
    id="weight" placeholder="Weight in KG">

    <br><br>

    <input type="number" 
    class="form-control"
    id="height" placeholder="Height in Metre">

    <br><br>

    <button onclick="checkBMI()">
        Check BMI
    </button>

    <p id="bmiResult"></p>


<!--*************** Unit Converter ***************-->   

    <hr>

    <h2>Unit Converter</h2>

    <input type="number"
    class="form-control"
    id="unitInput"
    placeholder="Enter Value">

    <br><br>

    <button onclick="cmToM()">
        CM to M
    </button>

    <button onclick="mToCm()">
        M to CM
    </button>

    <button onclick="mToKm()">
        M to KM
    </button>

    <button onclick="kmToM()">
        KM to M
    </button>

    <p id="unitResult"></p>


<!--*************** Income Tax Calculator ***************--> 

    <hr>

    <h2>Income Tax Calculator</h2>

    <input type="number"
    class="form-control"
    id="income"
    placeholder="Enter Your Income">

    <br><br>

    <button onclick="calculateTax()">
        Calculate Tax
    </button>

    <p id="taxResult"></p>
        
    </div>

    <script src="script.js"></script>

    
</body>
</html>
